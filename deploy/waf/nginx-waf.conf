# Nomad Sovereign Stack — nginx edge WAF + DDoS rate limits
# Place in front of gateway (:8080) and console (:8081)

limit_req_zone $binary_remote_addr zone=nomad_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=nomad_console:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=nomad_conn:10m;

server {
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    limit_conn nomad_conn 50;
    limit_req zone=nomad_api burst=60 nodelay;

    # OWASP common blocks
    if ($query_string ~* "(union.*select|insert.*into|drop.*table)") { return 403; }
    if ($request_uri ~* "\.\./") { return 403; }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Correlation-Id $request_id;
        client_max_body_size 64k;
    }
}

server {
    listen 443 ssl http2;
    server_name admin.example.com;

    ssl_protocols TLSv1.3;

    # Console — stricter limits + optional IP allowlist
    # allow 203.0.113.0/24;
    # deny all;

    limit_req zone=nomad_console burst=10 nodelay;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
